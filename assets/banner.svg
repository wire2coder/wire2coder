<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">Data, Code, Cloud</title>
  <desc id="d">Sci-fi banner with an animated atom and a grid background</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050914"/><stop offset="1" stop-color="#101a3e"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.35" stop-color="#22d3ee"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6d5dfc" stop-opacity="0.45"/><stop offset="1" stop-color="#6d5dfc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#22d3ee" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle cx="980" cy="160" r="230" fill="url(#halo)"/>

    <g fill="#ffffff">
      <circle cx="60" cy="40" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="310" cy="28" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="290" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="60" r="1.1"><animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="270" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="1150" cy="50" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.5s" repeatCount="indefinite"/></circle>
      <circle cx="1120" cy="285" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="140" cy="290" r="1.2"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/></circle>
    </g>

    <g transform="translate(980 160)" filter="url(#glow)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
        <g fill="none" stroke="url(#ink)" stroke-width="1.6" stroke-opacity="0.85">
          <ellipse rx="140" ry="46"/>
          <ellipse rx="140" ry="46" transform="rotate(60)"/>
          <ellipse rx="140" ry="46" transform="rotate(120)"/>
        </g>
        <circle r="5" fill="#22d3ee"><animateMotion dur="6s" repeatCount="indefinite" path="M140,0 A140,46 0 1,1 -140,0 A140,46 0 1,1 140,0"/></circle>
        <g transform="rotate(60)"><circle r="5" fill="#a78bfa"><animateMotion dur="8s" repeatCount="indefinite" path="M140,0 A140,46 0 1,1 -140,0 A140,46 0 1,1 140,0"/></circle></g>
        <g transform="rotate(120)"><circle r="5" fill="#f0abfc"><animateMotion dur="10s" repeatCount="indefinite" path="M140,0 A140,46 0 1,1 -140,0 A140,46 0 1,1 140,0"/></circle></g>
      </g>
      <circle r="34" fill="url(#core)"><animate attributeName="r" values="30;38;30" dur="3s" repeatCount="indefinite"/></circle>
      <circle r="8" fill="#ffffff"/>
    </g>

    <rect x="0" width="1200" height="2" fill="#22d3ee" opacity="0.18">
      <animate attributeName="y" values="-4;324" dur="7s" repeatCount="indefinite"/>
    </rect>

    <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace">
      <text x="60" y="92" font-size="16" fill="#22d3ee" letter-spacing="4">// SYSTEM ONLINE</text>
      <text x="60" y="170" font-size="70" font-weight="700" fill="url(#ink)" filter="url(#glow)" letter-spacing="2">DATA · CODE · CLOUD</text>
      <text x="62" y="214" font-size="19" fill="#c7d2fe">Front-end &amp; back-end apps with JavaScript, Python and R</text>
      <rect x="62" y="236" width="14" height="24" fill="#22d3ee">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
    <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="url(#ink)" stroke-opacity="0.5" stroke-width="2"/>
  </g>
</svg>
